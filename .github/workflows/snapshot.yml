name: Save new snapshot

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      BOT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      BOT_AUTHOR_NAME: github-actions[bot]
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Run a one-line script
        run: .\save-new-snapshot.ps1

      - name: "Save snapshot files"
        run: |
          git config --global user.name "${BOT_AUTHOR_EMAIL}"
          git config --global user.email "${BOT_AUTHOR_NAME}"
          git add ./data/
          git commit -m "save snapshot $(Get-Date -f 'yyyy-MM-dd')"
          git push origin ${GITHUB_REF}

