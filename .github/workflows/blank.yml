name: CI

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run a one-line script
        run: .\update.ps1

      - name: Run a multi-line script
        run: |
          Get-ChildItem ./downloads
